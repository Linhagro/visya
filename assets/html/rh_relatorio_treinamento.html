<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>VISYA - Relatório de Treinamento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  />

  <link rel="stylesheet" href="../css/rh_relatorio_treinamento.css" />
  <link rel="stylesheet" href="../css/loader.css" />

  <script src="../js/global.js" defer></script>
  <script src="../js/rh_relatorio_treinamento.js" defer></script>
</head>
<body>
  <div id="toastRh" class="toast-ano" aria-hidden="true">
    <span id="toastRhMsg"></span>
  </div>

  <main class="rh-page">
    <header class="dash-header">
      <div class="dash-header-left">
        <span class="dash-kicker">Recursos humanos</span>
        <h1 class="dash-title rh-titulo">
          Relatório <span>de Treinamento</span>
        </h1>
        <p class="rh-subtitulo">
          Inserção de novo formulário de treinamento por profissional.
        </p>
      </div>
      <div class="dash-header-right">
        <div class="rh-user-info">
          <span id="rhUserNome" class="rh-user-nome">Carregando...</span>
          <span id="rhUserEmail" class="rh-user-email"></span>
        </div>
      </div>
    </header>

    <section class="rh-form-section">
      <header class="rh-section-header">
        <p class="rh-section-kicker">Identificação</p>
        <h2 class="rh-section-title">Dados do Profissional</h2>
      </header>

      <div class="form-grid">
        <div class="filtro-campo">
          <label for="nomeProfissional">
            Profissional <span class="obrigatorio">*</span>
          </label>
          <input type="text" id="nomeProfissional" placeholder="Nome completo" autocomplete="off" />
        </div>

        <div class="filtro-campo">
          <label for="setor">
            Setor <span class="obrigatorio">*</span>
          </label>
          <input type="text" id="setor" placeholder="ex: LOGISTICA" autocomplete="off" />
        </div>

        <div class="filtro-campo">
          <label for="responsavelSetor">Responsável pelo Setor</label>
          <input type="text" id="responsavelSetor" placeholder="Nome do responsável" autocomplete="off" />
        </div>

        <div class="filtro-campo">
          <label for="dataInicioPeriodo">Início do Período</label>
          <input type="date" id="dataInicioPeriodo" />
        </div>

        <div class="filtro-campo">
          <label for="dataFimPeriodo">Fim do Período</label>
          <input type="date" id="dataFimPeriodo" />
        </div>

        <div class="filtro-campo">
          <label for="statusTreinamento">Status</label>
          <select id="statusTreinamento">
            <option value="1">Pendente</option>
            <option value="2">Em andamento</option>
            <option value="3">Concluído</option>
            <option value="4">Cancelado</option>
          </select>
        </div>
      </div>
    </section>

    <section class="rh-form-section rh-atividades-section">
      <header class="rh-section-header rh-atividades-header">
        <div>
          <p class="rh-section-kicker">Atividades</p>
          <h2 class="rh-section-title">
            Lista de atividades <span class="obrigatorio">*</span>
          </h2>
        </div>
        <button type="button" class="btn-filtro btn-filtro-novo" id="btnAdicionarLinha">
          <span>+ Adicionar linha</span>
        </button>
      </header>

      <div class="table-wrapper">
        <table class="rh-table">
          <colgroup>
            <col class="w-data" />
            <col class="w-atividade" />
            <col class="w-sn" />
            <col class="w-sn" />
            <col class="w-obs" />
            <col class="w-remover" />
          </colgroup>
          <thead>
            <tr>
              <th>Data <span class="obrigatorio">*</span></th>
              <th>Atividade <span class="obrigatorio">*</span></th>
              <th>Recebeu Trein.</th>
              <th>Tem Domínio</th>
              <th>Observações</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbodyAtividades"></tbody>
        </table>
      </div>
    </section>

    <section class="rh-form-footer">
      <p class="form-erro" id="formErro"></p>
      <div class="form-footer-actions">
        <button type="button" class="btn-filtro" id="btnLimparForm">
          <span>Limpar tudo</span>
        </button>
        <button type="button" class="btn-filtro btn-filtro-primary" id="btnSalvar">
          <span>Salvar Treinamentos</span>
        </button>
      </div>
    </section>
  </main>

  <div class="loader-overlay" id="loaderOverlay" aria-hidden="true">
    <iframe
      src="loader.html"
      class="loader-frame"
      frameborder="0"
      scrolling="no"
      title="Carregando..."
    ></iframe>
  </div>

  <script>
    const THEME_KEY = "visya-sidebar-theme";
    function applyLocalTheme() {
      let saved = null;
      try {
        saved = localStorage.getItem(THEME_KEY);
      } catch (e) {}
      const theme = saved === "light" || saved === "dark" ? saved : "dark";
      document.body.classList.toggle("light-theme", theme === "light");
    }
    applyLocalTheme();
    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "visya-theme") return;
      document.body.classList.toggle("light-theme", event.data.theme === "light");
      try {
        localStorage.setItem(THEME_KEY, event.data.theme);
      } catch (e) {}
    });
  </script>
</body>
</html>
