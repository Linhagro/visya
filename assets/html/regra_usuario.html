<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>VISYA - Regras de Usuários</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  />

  <link rel="stylesheet" href="../css/regra_usuario.css" />
  <link rel="stylesheet" href="../css/loader.css" />

  <script src="../js/global.js" defer></script>
  <script src="../js/regra_usuario.js" defer></script>
</head>
<body>
  <main class="regras-page">
    <header class="regras-header">
      <div class="regras-header-left">
        <h1 class="regras-titulo">Regras de Usuários</h1>
        <p class="regras-subtitulo">
          Selecione um usuário e defina o acesso de cada módulo e tela.
        </p>
      </div>
      <div class="regras-header-right">
        <div class="regras-user-info">
          <span id="regrasUserNome" class="regras-user-nome"></span>
          <span id="regrasUserEmail" class="regras-user-email"></span>
        </div>
      </div>
    </header>

    <div class="regras-split">
      <!-- ESQUERDA: USUÁRIOS -->
      <aside class="painel-usuarios">
        <div class="painel-usuarios-head">
          <p class="painel-titulo">Usuários</p>
          <div class="busca-wrap">
            <span class="busca-icon"><svg class="vicon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
            <input
              type="text"
              id="buscaUsuario"
              class="input-busca"
              placeholder="Buscar usuário..."
              autocomplete="off"
            />
          </div>
        </div>
        <div class="usuarios-lista" id="usuariosLista">
          <div class="usuarios-empty">Carregando usuários...</div>
        </div>
      </aside>

      <!-- DIREITA: PERMISSÕES -->
      <section class="painel-permissoes">
        <!-- Estado vazio -->
        <div class="permissoes-vazio" id="permissoesVazio">
          <div class="permissoes-vazio-icon"><svg class="vicon vicon-lg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
          <div class="permissoes-vazio-texto">
            Selecione um usuário na lista ao lado para ver e editar suas permissões.
          </div>
        </div>

        <!-- Conteúdo (escondido até selecionar usuário) -->
        <div id="permissoesConteudo" style="display:none; flex:1; min-height:0; flex-direction:column;">
          <div class="permissoes-head">
            <div class="permissoes-head-info">
              <span class="permissoes-usuario-nome" id="permUsuarioNome">—</span>
              <span class="permissoes-stats" id="permStats">
                <strong>0</strong> de 0 telas com acesso
              </span>
            </div>
            <div class="permissoes-head-actions">
              <button type="button" class="btn-acao" id="btnRecarregar">
                <svg class="vicon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg> Recarregar
              </button>
              <button type="button" class="btn-acao btn-acao-primary" id="btnSalvar">
                <svg class="vicon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Salvar
              </button>
            </div>
          </div>

          <div class="permissoes-toolbar">
            <div class="busca-wrap">
              <span class="busca-icon"><svg class="vicon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
              <input
                type="text"
                id="buscaTela"
                class="input-busca"
                placeholder="Buscar tela ou módulo..."
                autocomplete="off"
              />
            </div>
            <button type="button" class="btn-mini" id="btnExpandirTodos">Expandir tudo</button>
            <button type="button" class="btn-mini" id="btnMarcarTodos">Marcar tudo</button>
            <button type="button" class="btn-mini" id="btnLimparTodos">Limpar tudo</button>
          </div>

          <div class="modulos-lista" id="modulosLista"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- TOAST -->
  <div id="regrasToast" class="regras-toast"></div>

  <!-- LOADER GLOBAL -->
  <div class="loader-overlay" id="loaderOverlay" aria-hidden="true">
    <iframe
      src="loader.html"
      class="loader-frame"
      frameborder="0"
      scrolling="no"
      title="Carregando..."
    ></iframe>
  </div>

  <!-- Tema -->
  <script>
    const THEME_KEY = 'visya-sidebar-theme';

    function applyLocalThemeRegras() {
      let saved = null;
      try {
        saved = localStorage.getItem(THEME_KEY);
      } catch (e) {
        console.warn('[REGRAS] erro ao ler tema do localStorage:', e);
      }
      const theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
      const isLight = theme === 'light';
      document.body.classList.toggle('light-theme', isLight);
    }

    applyLocalThemeRegras();

    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'visya-theme') return;
      const theme = event.data.theme;
      const isLight = theme === 'light';
      document.body.classList.toggle('light-theme', isLight);
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (e) {
        console.warn('[REGRAS] erro ao salvar tema:', e);
      }
    });
  </script>
</body>
</html>
