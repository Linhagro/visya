<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Loader Draw</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: transparent;
    }

    body {
      background: transparent;
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* container do loader (posicionamento relativo p/ a partícula absoluta) */
    .loader {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .loader svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    /* base do path da logo */
    .loader .p {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;

      /* verde Linhagro */
      stroke: #3d8c5e;
    }

    /* fallback CSS: só roda enquanto o anime.js NÃO assumiu (sem .js-on).
       Quando o JS entra, .js-on é adicionado e estas regras param de valer,
       deixando o createDrawable controlar o stroke-dasharray livremente. */
    .loader:not(.js-on) .p {
      stroke-dasharray: 4000;
      stroke-dashoffset: 4000;
      animation: draw-fallback 2.8s ease-in-out infinite;
    }

    /* tema claro: traço fica num verde um pouco mais escuro p/ contraste */
    body.light-theme .loader .p {
      stroke: #2f6e49;
    }

    /* a partícula que percorre o contorno (circle dentro do SVG) */
    .loader .spark {
      fill: #4ba271;
      stroke: none;
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(75, 162, 113, 0.9));
    }

    .loader.js-on .spark {
      opacity: 1;
    }

    body.light-theme .loader .spark {
      fill: #2f6e49;
      filter: drop-shadow(0 0 5px rgba(47, 110, 73, 0.6));
    }

    @keyframes draw-fallback {
      0%   { stroke-dashoffset: 4000; opacity: 0.2; }
      50%  { stroke-dashoffset: 0;    opacity: 1; }
      100% { stroke-dashoffset: -4000; opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="loader" id="v1">
    <svg viewBox="0 0 1500 1067.66" xmlns="http://www.w3.org/2000/svg">
      <path class="p" id="pExt" d="M771.69,944.01c-29.55-17.73-49.39,7.48-88.66,28.1-73.57,38.63-162.36,21.98-215.5-40.61-30.54-35.97-40.23-79.57-29.06-125.24,16.19-66.19-22.79-134.12-88.1-152.59-32.88-9.3-59.79-27.32-78.12-56.33-51.99-82.32-24.91-191.95,59.95-239.9l46.91-26.51c10.34-5.84,16.39-16.82,16.71-28.85.62-23.85-1.11-47.72,1-71.25,8.38-93.18,88.72-156.15,180.14-156.22l348.62-.27c90.83-.07,168.9,66.53,176.43,157.8,1.93,23.38.59,46.44,1.09,70.27.26,12.35,6.6,23.26,17.24,29.28l49.24,27.84c89.32,50.5,107.26,159.45,57,246.14l-175.31,302.33c-48.02,82.81-156.39,109.89-238.01,60.93l-41.57-24.94Z"/>
      <path class="p" id="pInt" d="M720.42,878.01c7.53,12.73,17.82,19.09,30.8,18.83,12.6-.25,23.02-6.78,29.98-18.71l77.22-132.51,104.56-181.48,110.69-192.37c6.22-10.82,3.92-24.89-2.14-33.92-5.82-8.68-15.69-14.86-28.54-14.87l-585.81-.18c-14.17,0-24.38,6.02-30.62,15.62-6.46,9.94-7.06,23.34-.98,33.87l60.21,104.33c16.56,28.7,44.56,45.57,75.26,53.45,72.44,18.61,111.47,90.82,91.68,161.41-9.35,33.35-2.25,68.29,14.82,97.15l52.88,89.39Z"/>
      <circle class="spark" id="spark" r="22"></circle>
    </svg>
  </div>

  <!-- anime.js v4 + animação createMotionPath -->
  <script type="module">
    try {
      const { animate } = await import('https://cdn.jsdelivr.net/npm/animejs@4.0.2/+esm');

      const loader = document.getElementById('v1');
      const ext = document.getElementById('pExt');
      const int = document.getElementById('pInt');
      const spark = document.getElementById('spark');

      // ativa o modo JS (desliga o fallback CSS e mostra a partícula)
      loader.classList.add('js-on');

      const DUR = 3800;

      // Comprimento de cada subpath; o "split" é a fração do percurso total
      // gasta no contorno externo. A partícula percorre primeiro o externo
      // (revelando-o) e SÓ DEPOIS entra no recorte interno (V central),
      // que permanece oculto até a bolinha chegar nele.
      const Le = ext.getTotalLength();
      const Li = int.getTotalLength();
      const split = Le / (Le + Li);

      // ambos começam ocultos
      ext.style.strokeDasharray = Le;
      ext.style.strokeDashoffset = Le;
      int.style.strokeDasharray = Li;
      int.style.strokeDashoffset = Li;

      const state = { p: 0 };
      animate(state, {
        p: 1,
        ease: 'linear',
        duration: DUR,
        loop: true,
        onUpdate: () => {
          const prog = state.p;
          let pt;
          if (prog <= split) {
            // fase 1: desenhando o contorno externo
            const local = prog / split;
            ext.style.strokeDashoffset = Le * (1 - local);
            int.style.strokeDashoffset = Li; // interno ainda escondido
            pt = ext.getPointAtLength(Le * local);
          } else {
            // fase 2: externo completo, agora desenha o V interno
            const local = (prog - split) / (1 - split);
            ext.style.strokeDashoffset = 0;
            int.style.strokeDashoffset = Li * (1 - local);
            pt = int.getPointAtLength(Li * local);
          }
          spark.setAttribute('cx', pt.x);
          spark.setAttribute('cy', pt.y);
        },
      });
    } catch (e) {
      // se o anime.js não carregar (offline etc.), mantém o draw CSS fallback
      console.warn('[LOADER] anime.js indisponível, usando fallback CSS:', e);
    }
  </script>

  <!-- JS de tema: lê localStorage e ouve postMessage do sidebar -->
  <script>
    const THEME_KEY = 'visya-sidebar-theme';

    function applyLocalThemeLoader() {
      let saved = null;
      try {
        saved = localStorage.getItem(THEME_KEY);
      } catch (e) {
        console.warn('[LOADER] erro ao ler tema do localStorage:', e);
      }
      const theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
      const isLight = theme === 'light';
      document.body.classList.toggle('light-theme', isLight);
    }

    applyLocalThemeLoader();

    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'visya-theme') return;
      const theme = event.data.theme;
      const isLight = theme === 'light';
      document.body.classList.toggle('light-theme', isLight);
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (e) {
        console.warn('[LOADER] erro ao salvar tema:', e);
      }
    });
  </script>

  <!-- JS que você já usa para showLoader/hideLoader via overlay -->
  <script src="/assets/js/loader.js"></script>
</body>
</html>
